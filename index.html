<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KA-SÁSUSHI — Menu Luxury 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #080808; --gold: #c8a882; --line: rgba(255,255,255,0.08); }
    body { background: #080808; color: #f4efe8; font-family: 'Inter', sans-serif; }
   .font-heading { font-family: 'Cinzel', serif; }
   .gold { color: var(--gold); }
   .glass { background: rgba(15,15,15,0.92); border: 1px solid var(--line); backdrop-filter: blur(20px); }
   .menu-card { background: rgba(255,255,255,0.03); border: 1px solid var(--line); transition: all.25s ease; }
   .menu-card:hover { transform: translateY(-6px); border-color: rgba(200,168,130,0.6); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
   .hero-pattern { background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?auto=format&fit=crop&w=1600&q=80'); background-size: cover; background-position: center; }
  </style>
</head>
<body>

<header class="hero-pattern relative h-screen flex items-center">
  <nav class="absolute top-0 left-0 right-0 z-20 px-6 md:px-16 py-6 flex justify-between">
    <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full border border-white/20 bg-black/40 flex items-center justify-center text-[#d9b37b] font-bold">鮨</div><div class="font-heading text-lg tracking-widest">KA-SÁ<span class="gold">SUSHI</span></div></div>
    <div class="text-[10px] tracking-widest text-white/50">VIDEIRA • SC • DELIVERY</div>
  </nav>
  <div class="relative z-10 px-6 md:px-20 max-w-2xl">
    <p class="text-[10px] tracking-[0.35em] uppercase text-white/40 mb-6">Edomae · Tradição Oriental Autêntica</p>
    <h1 class="font-heading text-6xl md:text-8xl leading-none">KA-SÁ<span class="gold">SUSHI</span></h1>
    <p class="mt-8 italic text-white/60 text-lg">"Carregue a tradição em seu bolso."</p>
    <button onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})" class="mt-10 px-10 py-4 border border-[#c8a882] text-[#c8a882] rounded-full text-sm tracking-widest uppercase hover:bg-[#c8a882] hover:text-black transition">Ver cardápio</button>
  </div>
</header>

<main id="menu" class="px-6 md:px-20 py-20 max-w-[1400px] mx-auto">
  <section class="mb-20"><div class="flex items-center gap-3 mb-10"><span class="text-[#8a1d1d]/50 text-3xl">前</span><h2 class="font-heading text-4xl">Entradas</h2></div><div id="entradas" class="grid gap-6 md:grid-cols-3"></div></section>
  <section class="mb-20"><div class="flex items-center gap-3 mb-10"><span class="text-[#8a1d1d]/50 text-3xl">巻</span><h2 class="font-heading text-4xl">Uramaki</h2></div><div id="uramaki" class="grid gap-6 md:grid-cols-3"></div></section>
  <section class="mb-20"><div class="flex items-center gap-3 mb-10"><span class="text-[#8a1d1d]/50 text-3xl">細</span><h2 class="font-heading text-4xl">Hossomaki</h2></div><div id="hossomaki" class="grid gap-6 md:grid-cols-3"></div></section>
  <section class="mb-20"><div class="flex items-center gap-3 mb-10"><span class="text-[#8a1d1d]/50 text-3xl">手</span><h2 class="font-heading text-4xl">Temaki</h2></div><div id="temaki" class="grid gap-6 md:grid-cols-3"></div></section>
  <section class="mb-20"><div class="flex items-center gap-3 mb-10"><span class="text-[#8a1d1d]/50 text-3xl">甘</span><h2 class="font-heading text-4xl">Sobremesas</h2></div><div id="sobremesa" class="grid gap-6 md:grid-cols-3"></div></section>
</main>

<footer class="border-t border-white/10 bg-[#0b0b0b] px-6 md:px-20 py-16"><div class="max-w-5xl mx-auto text-center text-xs text-white/30">KA-SÁSUSHI © 2024 — Ismael Klann — O SUSHI MAN</div></footer>

<!-- DOCK -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-3 rounded-full glass">
  <button onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})" class="w-11 h-11 rounded-full bg-white/5 flex items-center justify-center">☰</button>
  <button id="cart-btn" onclick="toggleCart()" class="relative w-11 h-11 rounded-full bg-white/5 flex items-center justify-center">🛒<span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 w-5 h-5 rounded-full text-[11px] flex items-center justify-center hidden">0</span></button>
  <button onclick="openWhatsApp()" class="w-11 h-11 rounded-full bg-[#25d366] flex items-center justify-center text-white font-bold">✓</button>
</div>

<div id="cart-panel" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-sm glass rounded-3xl p-6 hidden">
  <div class="flex justify-between mb-5"><h3 class="font-heading text-xl">Seu Pedido</h3><button onclick="toggleCart()" class="text-2xl text-white/50">×</button></div>
  <div id="cart-items" class="space-y-3 max-h-64 overflow-y-auto mb-5"></div>
  <div class="flex justify-between"><span class="text-white/60 text-sm">Total:</span><span id="cart-total" class="text-[#d9b37b] font-bold">R$ 0,00</span></div>
  <button onclick="openWhatsApp()" class="w-full mt-4 bg-[#25d366] py-3 rounded-full font-bold">Confirmar no WhatsApp</button>
</div>

<script>
const images = {
  gyoza: 'https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=400',
  edamame: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400',
  sunomono: 'https://images.unsplash.com/photo-1555126634-323283e090fa?w=400',
  ceviche: 'https://images.unsplash.com/photo-1534766555764-ce878a5e3a2b?w=400',
  california: 'https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=400',
  kani: 'https://images.unsplash.com/photo-1617196034183-421b4917c92d?w=400',
  hot: 'https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=400',
  veg: 'https://images.unsplash.com/photo-1546069901-eacef0df6022?w=400',
  temaki: 'https://images.unsplash.com/photo-1553621042-f6e147245754?w=400',
  dorayaki: 'https://images.unsplash.com/photo-1551024506-0bccd828d307?w=400',
};

const menu = {
  entradas: [
    { id:"e1", name:"Gyoza de Frango", desc:"Massa crocante com molho shoyu clássico.", price:28, img: images.gyoza },
    { id:"e2", name:"Edamame Salgado", desc:"Vagem fresca com flor de sal himalaia.", price:22, img: images.edamame },
    { id:"e3", name:"Sunomono", desc:"Pepino e cenoura em vinagre de arroz.", price:24, img: images.sunomono },
    { id:"e4", name:"Ceviche de Salmão", desc:"Salmão em cítrico e óleo de gergelim.", price:36, img: images.ceviche },
  ],
  uramaki: [
    { id:"u1", name:"California Gold", desc:"Salmão, abacate e pepino.", price:34, img: images.california },
    { id:"u2", name:"Kani Crunch", desc:"Camarão tempurá e kani.", price:32, img: images.kani },
    { id:"u3", name:"Hot Tuna", desc:"Atum, goiaba e pimenta.", price:38, img: images.hot },
    { id:"u4", name:"Vegetal Zen", desc:"Abobrinha e cream cheese leve.", price:29, img: images.veg },
  ],
  hossomaki: [
    { id:"h1", name:"Salmão Nori", desc:"Salmão fresco e arroz temperado.", price:27, img: images.california },
    { id:"h2", name:"Pepino Fresco", desc:"Clássico e refrescante.", price:22, img: images.veg },
    { id:"h3", name:"Atum Kuro", desc:"Atum com toque de shiso.", price:31, img: images.hot },
    { id:"h4", name:"Camarão Dashi", desc:"Perfil sutil e sofisticado.", price:30, img: images.kani },
  ],
  temaki: [
    { id:"t1", name:"Temaki Salmão", desc:"Cone crocante com salmão fresco.", price:33, img: images.temaki },
    { id:"t2", name:"Temaki Atum", desc:"Atum e ponzu.", price:34, img: images.temaki },
    { id:"t3", name:"Temaki Camarão", desc:"Camarão com manga.", price:35, img: images.temaki },
    { id:"t4", name:"Temaki Veggie", desc:"Abacate e pepino.", price:28, img: images.temaki },
  ],
  sobremesa: [
    { id:"s1", name:"Dorayaki", desc:"Panqueca com adzuki.", price:18, img: images.dorayaki },
    { id:"s2", name:"Mochi Morango", desc:"Arroz com morango.", price:17, img: images.dorayaki },
    { id:"s3", name:"Yuzu Cheesecake", desc:"Citrinos orientais.", price:22, img: images.dorayaki },
    { id:"s4", name:"Pudim Matcha", desc:"Cremoso com matcha.", price:19, img: images.dorayaki },
  ]
};

let cart = [];
const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);

function renderMenus(){
  Object.keys(menu).forEach(key=>{
    document.getElementById(key).innerHTML = menu[key].map(item=>`
      <div class="menu-card rounded-2xl overflow-hidden">
        <img src="${item.img}" class="h-[180px] w-full object-cover" />
        <div class="p-5">
          <h3 class="font-heading text-lg">${item.name}</h3>
          <p class="text-xs text-white/50 mb-3 mt-1">${item.desc}</p>
          <div class="flex justify-between items-center">
            <span class="text-[#d9b37b] font-bold">${fmt(item.price)}</span>
            <button onclick="addCart('${item.id}')" class="px-5 py-2 bg-[#c8a882]/15 border border-[#c8a882]/40 text-[#d9b37b] rounded-full text-xs hover:bg-[#c8a882] hover:text-black transition">Adicionar</button>
          </div>
        </div>
      </div>
    `).join('');
  });
}
function getProduct(id){ for(const c of Object.values(menu)){ const f=c.find(i=>i.id===id); if(f) return f; } }
function addCart(id){ const p=getProduct(id); const e=cart.find(i=>i.id===id); if(e) e.qty++; else cart.push({...p,qty:1}); updateCart(); document.getElementById('cart-panel').classList.remove('hidden'); }
function updateQty(id,d){ const i=cart.find(x=>x.id===id); if(!i) return; i.qty+=d; if(i.qty<=0) cart=cart.filter(x=>x.id!==id); updateCart(); }
function updateCart(){
  const count=cart.reduce((s,i)=>s+i.qty,0), total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('cart-count').textContent=count;
  document.getElementById('cart-count').classList.toggle('hidden',count===0);
  document.getElementById('cart-total').textContent=fmt(total);
  document.getElementById('cart-items').innerHTML = cart.length===0? '<p class="text-center text-white/40 text-sm py-6">Carrinho vazio</p>' : cart.map(i=>`
    <div class="flex justify-between items-center bg-white/[0.04] p-3 rounded-xl">
      <div><p class="text-sm font-medium">${i.name} x${i.qty}</p><p class="text-xs text-white/40">${fmt(i.price*i.qty)}</p></div>
      <div class="flex gap-2"><button onclick="updateQty('${i.id}',-1)" class="w-6 h-6 bg-white/10 rounded">−</button><button onclick="updateQty('${i.id}',1)" class="w-6 h-6 bg-[#c8a882]/20 rounded">+</button></div>
    </div>
  `).join('');
}
function toggleCart(){ document.getElementById('cart-panel').classList.toggle('hidden'); }
function openWhatsApp(){
  if(!cart.length) return alert('Adicione itens primeiro!');
  let msg='*🍣 Pedido KA-SÁSUSHI*\n\n'; let total=0;
  cart.forEach(i=>{ total+=i.price*i.qty; msg+=`• ${i.name} (x${i.qty}) - ${fmt(i.price*i.qty)}\n`; });
  msg+=`\n*Total: ${fmt(total)}*`;
  window.open(`https://wa.me/5585988889999?text=${encodeURIComponent(msg)}`,'_blank');
}
renderMenus(); updateCart();
</script>
</body>
</html>
