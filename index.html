<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KA-SÁSUSHI — Menu Luxury 3.0 | Videira SC</title>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Restaurant","name":"KA-SÁSUSHI","address":{"@type":"PostalAddress","addressLocality":"Videira","addressRegion":"SC"}}</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{background:#080808;color:#f4efe8;font-family:Inter}.font-heading{font-family:Cinzel}.glass{background:rgba(15,15,15,.92);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px)}.menu-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);transition:.25s}.menu-card:hover{transform:translateY(-6px);border-color:#c8a882}</style>
</head>
<body>
<header class="relative h-[90vh] flex items-center bg-cover bg-center" style="background-image:linear-gradient(rgba(0,0,0,.6),#000),url('https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=1600')">
<nav class="absolute top-0 w-full px-6 md:px-16 py-6 flex justify-between"><span class="font-heading tracking-widest">KA-SÁ<span class="text-[#c8a882]">SUSHI</span></span><span class="text-[10px] tracking-widest opacity-50">VIDEIRA • SC • DELIVERY</span></nav>
<div class="px-6 md:px-20"><p class="text-[10px] tracking-[0.35em] opacity-40">EDOMAE • TRADIÇÃO AUTÊNTICA</p><h1 class="font-heading text-6xl md:text-8xl mt-4">KA-SÁ<span class="text-[#c8a882]">SUSHI</span></h1><button onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})" class="mt-8 px-10 py-4 border border-[#c8a882] text-[#c8a882] rounded-full uppercase text-sm">Ver cardápio</button></div>
</header>

<main id="menu" class="px-6 md:px-20 py-20 max-w-[1400px] mx-auto">
<div id="grid" class="grid gap-6 md:grid-cols-3"></div>
</main>

<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex gap-2 px-4 py-3 rounded-full glass">
<button onclick="scrollTo(0,0)" class="w-11 h-11 bg-white/5 rounded-full">☰</button>
<button onclick="toggleCart()" class="relative w-11 h-11 bg-white/5 rounded-full">🛒<span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-[10px] w-5 h-5 rounded-full hidden flex items-center justify-center">0</span></button>
<button onclick="openWA()" class="w-11 h-11 bg-[#25d366] rounded-full">✓</button>
</div>

<div id="cart-panel" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-sm glass rounded-3xl p-6 hidden">
<div class="flex justify-between mb-4"><h3 class="font-heading">Seu Pedido</h3><button onclick="toggleCart()">×</button></div>
<div id="cart-items" class="max-h-64 overflow-y-auto space-y-2 mb-4"></div>
<div class="flex justify-between font-bold"><span>Total</span><span id="cart-total" class="text-[#c8a882]">R$ 0,00</span></div>
<button onclick="openWA()" class="w-full mt-4 bg-[#25d366] py-3 rounded-full font-bold">Confirmar no WhatsApp</button>
</div>

<script>
const MENU=[
{name:"Gyoza de Frango",desc:"Massa crocante + shoyu",price:28,img:"https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=500",cat:"Entradas"},
{name:"Edamame Salgado",desc:"Flor de sal himalaia",price:22,img:"https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500",cat:"Entradas"},
{name:"California Gold",desc:"Salmão, abacate, pepino",price:34,img:"https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=500",cat:"Uramaki"},
{name:"Kani Crunch",desc:"Camarão tempurá",price:32,img:"https://images.unsplash.com/photo-1617196034183-421b4917c92d?w=500",cat:"Uramaki"},
{name:"Hot Tuna",desc:"Atum, goiaba, pimenta",price:38,img:"https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=500",cat:"Uramaki"},
{name:"Salmão Nori",desc:"Salmão fresco",price:27,img:"https://images.unsplash.com/photo-1553621042-f6e147245754?w=500",cat:"Hossomaki"},
{name:"Temaki Salmão",desc:"Cone crocante",price:33,img:"https://images.unsplash.com/photo-1555126634-323283e090fa?w=500",cat:"Temaki"},
{name:"Mochi Morango",desc:"Arroz + morango",price:17,img:"https://images.unsplash.com/photo-1551024506-0bccd828d307?w=500",cat:"Sobremesas"},
];
let cart=JSON.parse(localStorage.getItem('ka_cart')||'[]');
const fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
function render(){document.getElementById('grid').innerHTML=MENU.map(m=>`<div class="menu-card rounded-2xl overflow-hidden"><img src="${m.img}" class="h-[180px] w-full object-cover"/><div class="p-5"><p class="text-[10px] tracking-widest text-[#c8a882]">${m.cat}</p><h3 class="font-heading mt-1">${m.name}</h3><p class="text-xs opacity-50 mt-1">${m.desc}</p><div class="flex justify-between mt-4"><span class="text-[#c8a882] font-bold">${fmt(m.price)}</span><button onclick="add('${m.name}')" class="px-4 py-1 border border-[#c8a882]/40 rounded-full text-xs">Adicionar</button></div></div></div>`).join(''); update();}
function add(name){const p=MENU.find(x=>x.name===name);const e=cart.find(x=>x.name===name); if(e) e.qty++; else cart.push({...p,qty:1}); save();}
function save(){localStorage.setItem('ka_cart',JSON.stringify(cart)); update(); document.getElementById('cart-panel').classList.remove('hidden');}
function update(){
const c=cart.reduce((s,i)=>s+i.qty,0), t=cart.reduce((s,i)=>s+i.price*i.qty,0);
document.getElementById('cart-count').innerText=c; document.getElementById('cart-count').classList.toggle('hidden',c===0);
document.getElementById('cart-total').innerText=fmt(t);
document.getElementById('cart-items').innerHTML=cart.length?cart.map(i=>`<div class="flex justify-between bg-white/5 p-3 rounded-xl"><span class="text-sm">${i.name} x${i.qty}</span><span class="text-sm text-[#c8a882]">${fmt(i.price*i.qty)}</span></div>`).join(''):'<p class="text-center opacity-40 text-sm py-6">Carrinho vazio</p>';
}
function toggleCart(){document.getElementById('cart-panel').classList.toggle('hidden');}
function openWA(){if(!cart.length) return alert('Carrinho vazio');let msg='*🍣 Pedido KA-SÁSUSHI - Videira SC*\n\n';let tot=0;cart.forEach(i=>{tot+=i.price*i.qty;msg+=`• ${i.name} x${i.qty} - ${fmt(i.price*i.qty)}\n`});msg+=`\n*Total: ${fmt(tot)}*`;window.open(`https://wa.me/5549999999999?text=${encodeURIComponent(msg)}`,'_blank');}
render();
</script>
</body>
</html>
